<script id="mti4PanelStudioUpgrade">
document.addEventListener('DOMContentLoaded', function() {
  if (document.getElementById('studio4PanelCard')) return;

  const fixForm = document.getElementById('mattressFixForm') || document.querySelector('form[action*="add_fix"]');
  if (fixForm && !document.getElementById('btnPreview4Panel')) {
    const saveBtn = fixForm.querySelector('button[type="submit"]');
    if (saveBtn) {
      const b = document.createElement('button');
      b.type = 'button'; b.id = 'btnPreview4Panel';
      b.className = 'btn btn-sm btn-info text-dark fw-bold ms-2';
      b.innerHTML = '&#128202; Preview 4-Panel Chart &amp; Report';
      b.onclick = function() { window.trigger4PanelFromForm(fixForm); };
      saveBtn.parentNode.insertBefore(b, saveBtn.nextSibling);
    }
  }

  document.querySelectorAll('table tbody tr').forEach(function(tr) {
    const editBtn = tr.querySelector('button[onclick*="Fix"], a[href*="delete_fix"]');
    if (!editBtn || tr.querySelector('.btn-4panel-ledger')) return;
    const firstTd = tr.querySelector('td');
    const uno = firstTd ? firstTd.textContent.replace(/[^0-9]/g, '').trim() : '';
    if (!uno) return;
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'btn btn-xs btn-sm btn-outline-info fw-bold me-1 btn-4panel-ledger';
    b.innerHTML = '&#128202; 4-Panel';
    b.onclick = function(e) { e.stopPropagation(); window.run4PanelStudio({ unit_no: uno }); };
    editBtn.parentNode.insertBefore(b, editBtn);
  });

  const card = document.createElement('div');
  card.id = 'studio4PanelCard';
  card.className = 'card shadow-sm border-info mt-4 mb-4';
  card.innerHTML = [
    '<div class="card-header bg-dark text-white d-flex flex-wrap justify-content-between align-items-center py-2 px-3">',
    '  <div class="fw-bold text-info">&#128202; Subsea Mattress 4-Panel Verification &amp; Editable Submittal Studio</div>',
    '  <div class="d-flex flex-wrap align-items-center gap-1">',
    '    <span id="fpActiveFilename" class="badge bg-secondary font-monospace me-2">20261104_Mattress_CR-A1_M15_A046.pdf</span>',
    '    <a id="dlA3Pdf" href="/mti/download_a3_pdf" class="btn btn-sm btn-danger fw-bold py-0 px-2">A3 Chart PDF</a>',
    '    <a id="dlA3Png" href="/mti/download_a3_png" class="btn btn-sm btn-info text-dark fw-bold py-0 px-2">A3 PNG</a>',
    '    <a id="dlA4Pdf" href="/mti/download_a4_pdf" class="btn btn-sm btn-warning text-dark fw-bold py-0 px-2">A4 Report PDF</a>',
    '    <a id="dlDocx" href="/mti/download_docx" class="btn btn-sm btn-primary fw-bold py-0 px-2">Editable Word (.docx)</a>',
    '  </div>',
    '</div>',
    '<div class="card-body p-3 bg-light">',
    '  <div class="row g-2 align-items-end mb-3 bg-white p-2 rounded border">',
    '    <div class="col-md-2 col-6"><label class="small fw-bold">Panel 1 Scale</label><select id="fpScP1" class="form-select form-select-sm"><option value="200">1:200</option><option value="250" selected>1:250</option><option value="300">1:300</option><option value="400">1:400</option></select></div>',
    '    <div class="col-md-2 col-6"><label class="small fw-bold">Panel 2 Scale</label><select id="fpScP2" class="form-select form-select-sm"><option value="50">1:50</option><option value="75" selected>1:75</option><option value="100">1:100</option></select></div>',
    '    <div class="col-md-4 col-12 d-flex flex-wrap gap-3 align-items-center pt-3">',
    '      <div class="form-check form-switch"><input class="form-check-input" type="checkbox" id="fpSnd" checked><label class="form-check-label small fw-bold" for="fpSnd">2.0m Spot Soundings</label></div>',
    '      <div class="form-check form-switch"><input class="form-check-input" type="checkbox" id="fpCnt" checked><label class="form-check-label small fw-bold" for="fpCnt">0.05m Contours</label></div>',
    '      <div class="form-check form-switch"><input class="form-check-input" type="checkbox" id="fpHist" checked><label class="form-check-label small fw-bold" for="fpHist">Include Historical Data</label></div>',
    '    </div>',
    '    <div class="col-md-4 col-12 d-flex gap-1 align-items-center">',
    '      <input type="file" id="fpSeabedFile" class="form-control form-control-sm" accept=".xyz,.csv,.txt" title="Pre-Survey Seabed .xyz">',
    '      <button type="button" class="btn btn-sm btn-outline-secondary fw-bold text-nowrap" onclick="window.uploadSeabedXyz()">Upload Seabed</button>',
    '      <button type="button" id="btnRefresh4P" class="btn btn-sm btn-success fw-bold text-nowrap" onclick="window.run4PanelStudio({unit_no: window._last4PUnit || 1})">Refresh</button>',
    '    </div>',
    '  </div>',
    '  <div class="row g-3">',
    '    <div class="col-lg-7"><div class="border rounded bg-dark p-1 text-center" style="min-height:340px;display:flex;align-items:center;justify-content:center;"><img id="fpPreviewImg" src="/mti/download_a3_png" class="img-fluid rounded bg-white" style="max-height:520px;" alt="4-Panel A3 Preview"></div></div>',
    '    <div class="col-lg-5 d-flex flex-column"><div class="border rounded bg-white p-2 d-flex flex-column h-100">',
    '      <div class="d-flex justify-content-between align-items-center mb-1"><span class="small fw-bold">A4 Verification Report Editor</span><div class="btn-group btn-group-sm"><button type="button" class="btn btn-outline-secondary active" id="tabVis" onclick="window.toggleFpTab(false)">Visual</button><button type="button" class="btn btn-outline-secondary" id="tabMd" onclick="window.toggleFpTab(true)">Markdown</button></div></div>',
    '      <div id="fpVisBox" contenteditable="true" class="form-control small flex-grow-1 mb-2" style="height:360px;overflow-y:auto;white-space:pre-wrap;font-family:system-ui,sans-serif;"></div>',
    '      <textarea id="fpMdBox" class="form-control form-control-sm font-monospace flex-grow-1 mb-2" style="height:360px;display:none;"></textarea>',
    '      <div class="d-flex align-items-center gap-2"><button type="button" class="btn btn-sm btn-primary fw-bold flex-grow-1" onclick="window.apply4PanelReportEdits()">&#128190; Apply Edits to A4 PDF &amp; Word (.docx)</button><span id="fpEditMsg" class="small fw-bold text-success"></span></div>',
    '    </div></div>',
    '  </div>',
    '</div>'
  ].join('\n');
  (document.querySelector('.container-fluid') || document.body).appendChild(card);

  window.toggleFpTab = function(showMd) {
    const vis = document.getElementById('fpVisBox'), md = document.getElementById('fpMdBox');
    if (showMd) { md.value = vis.innerText; vis.style.display = 'none'; md.style.display = 'block'; }
    else { vis.innerText = md.value; md.style.display = 'none'; vis.style.display = 'block'; }
    document.getElementById('tabVis').classList.toggle('active', !showMd);
    document.getElementById('tabMd').classList.toggle('active', showMd);
  };

  window.run4PanelStudio = function(payload) {
    if (payload.unit_no) window._last4PUnit = payload.unit_no;
    payload.scale_p1 = document.getElementById('fpScP1').value;
    payload.scale_p2 = document.getElementById('fpScP2').value;
    payload.show_soundings = document.getElementById('fpSnd').checked;
    payload.show_contours = document.getElementById('fpCnt').checked;
    payload.include_history = document.getElementById('fpHist').checked;
    const btn = document.getElementById('btnRefresh4P');
    if (btn) { btn.disabled = true; btn.innerText = 'Rendering...'; }
    fetch('/mti/verify_4panel', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload) })
      .then(r => r.json()).then(d => {
        if (btn) { btn.disabled = false; btn.innerText = 'Refresh'; }
        if (d.status === 'ok') {
          document.getElementById('fpPreviewImg').src = 'data:image/png;base64,' + d.image_b64;
          document.getElementById('fpMdBox').value = d.report_md || '';
          document.getElementById('fpVisBox').innerText = d.report_md || '';
          if (d.metrics && d.metrics.base_filename) {
            document.getElementById('fpActiveFilename').innerText = d.metrics.base_filename + '.pdf';
          }
          document.getElementById('studio4PanelCard').scrollIntoView({ behavior: 'smooth' });
        }
      }).catch(() => { if (btn) { btn.disabled = false; btn.innerText = 'Refresh'; } });
  };

  window.trigger4PanelFromForm = function(formEl) {
    const fd = new FormData(formEl), obj = {};
    fd.forEach((v, k) => { obj[k] = v; });
    window.run4PanelStudio(obj);
  };

  window.apply4PanelReportEdits = function() {
    const md = document.getElementById('fpMdBox'), vis = document.getElementById('fpVisBox');
    const txt = (md.style.display !== 'none') ? md.value : vis.innerText;
    md.value = txt;
    const msg = document.getElementById('fpEditMsg');
    msg.innerText = 'Saving...';
    fetch('/mti/update_4panel_report', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ report_md: txt }) })
      .then(r => r.json()).then(d => { msg.innerText = 'Updated!'; setTimeout(() => { msg.innerText = ''; }, 2500); });
  };

  window.uploadSeabedXyz = function() {
    const f = document.getElementById('fpSeabedFile').files[0];
    if (!f) return alert('Select a .xyz or .csv seabed file first.');
    const fd = new FormData(); fd.append('seabed_file', f); fd.append('crossing_id', 'CR-A1_L1');
    fetch('/mti/upload_seabed', { method: 'POST', body: fd }).then(r => r.json()).then(d => {
      alert('Uploaded ' + (d.points || 0) + ' seabed soundings for ' + d.crossing_id);
      window.run4PanelStudio({ unit_no: window._last4PUnit || 1 });
    });
  };

  window.run4PanelStudio({ unit_no: 1 });
});
</script>
