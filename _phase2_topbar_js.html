<script id="mti4PanelStudioUpgrade">
(function() {
  window.MTI_CURRENT_USER_NAME = '';

  function detectCurrentUserFromDom() {
    const srvInp = document.querySelector('input[name="surveyor"]:not(#inpFormSurveyorName), input[name="user_name"], input[name="operator"], #surveyorNameInput');
    if (srvInp && srvInp.value && srvInp.value.trim() && srvInp.value.trim().toLowerCase() !== 'duty surveyor') {
      return srvInp.value.trim();
    }
    const navUser = document.querySelector('.navbar-text, .user-badge, #currentUserBadge');
    if (navUser && navUser.textContent && navUser.textContent.trim().length > 1 && navUser.textContent.trim().length < 40) {
      const cl = navUser.textContent.replace(/^(user|logged in as|surveyor)\s*:\s*/i, '').trim();
      if (cl && cl.toLowerCase() !== 'duty surveyor') return cl;
    }
    return '';
  }

  function syncSurveyorInputBox(forceIfDuty) {
    const inp = document.getElementById('inpFormSurveyorName') || document.querySelector('[name="surveyor_name"]');
    if (!inp) return;
    const curVal = (inp.value || '').trim();
    const bestUser = window.MTI_CURRENT_USER_NAME || detectCurrentUserFromDom();
    if (bestUser && (!curVal || (forceIfDuty && curVal.toLowerCase() === 'duty surveyor'))) {
      inp.value = bestUser;
    }
  }

  function getSelectedDprDate() {
    const dtInput = document.querySelector('input[type="date"], input[name*="dpr_date"], input[id*="dprDate"], input[placeholder*="YYYY"]');
    if (dtInput && dtInput.value && dtInput.value.trim()) {
      return dtInput.value.trim();
    }
    return '';
  }

  function removeLine4ZInputs() {
    document.querySelectorAll('div, span, label, h6, small').forEach(function(el) {
      if (el.children.length === 0 && el.textContent) {
        if (el.textContent.indexOf('E, N, Z OF 4-CORNERS') !== -1) {
          el.textContent = el.textContent.replace('E, N, Z OF 4-CORNERS', 'E, N OF 4-CORNERS');
        } else if (/Corner\s+[1-4]\s*\(C[1-4]\s*-\s*[NESW]{2}:\s*E,\s*N,\s*Z\)/i.test(el.textContent)) {
          el.textContent = el.textContent.replace(/:\s*E,\s*N,\s*Z\)/i, ': E, N)');
        }
      }
    });

    const zSelectors = [
      'input[name="c1_z"]', 'input[name="c2_z"]', 'input[name="c3_z"]', 'input[name="c4_z"]',
      '#c1_z', '#c2_z', '#c3_z', '#c4_z',
      'input[placeholder="Z1"]', 'input[placeholder="Z2"]', 'input[placeholder="Z3"]', 'input[placeholder="Z4"]'
    ];
    document.querySelectorAll(zSelectors.join(',')).forEach(function(zInp) {
      zInp.type = 'hidden';
      zInp.style.display = 'none';
      const prev = zInp.previousElementSibling;
      if (prev && prev.tagName === 'INPUT') {
        prev.style.borderTopRightRadius = '0.25rem';
        prev.style.borderBottomRightRadius = '0.25rem';
      }
    });
  }

  function customizeTopActionBar() {
    const oldSetupBtn = document.getElementById('btnTopSurveySetup');
    if (oldSetupBtn) oldSetupBtn.remove();

    let dprAnchorBtn = null;

    document.querySelectorAll('a.btn, button.btn').forEach(function(btn) {
      const txt = (btn.textContent || '').replace(/\s+/g, ' ').trim();
      const href = (btn.getAttribute('href') || '').toLowerCase();

      // 1. Scan QR -> keep only icon, remove text
      if (txt.indexOf('Scan QR') !== -1) {
        const icon = btn.querySelector('i, svg');
        btn.title = 'Scan QR';
        btn.setAttribute('aria-label', 'Scan QR');
        if (icon) {
          icon.className = icon.className.replace(/\bme-\d+\b/g, '').trim();
          btn.innerHTML = '';
          btn.appendChild(icon);
        } else {
          btn.innerHTML = '<i class="fas fa-qrcode"></i>';
        }
        btn.classList.add('px-2');
      }
      // 2. Mobile Input Page -> keep only icon, remove text
      else if (txt.indexOf('Mobile Input Page') !== -1 || href.indexOf('mobile') !== -1) {
        if (txt.indexOf('Mobile Input') !== -1) {
          const icon = btn.querySelector('i, svg');
          btn.title = 'Mobile Input Page';
          btn.setAttribute('aria-label', 'Mobile Input Page');
          if (icon) {
            icon.className = icon.className.replace(/\bme-\d+\b/g, '').trim();
            btn.innerHTML = '';
            btn.appendChild(icon);
          } else {
            btn.innerHTML = '<i class="fas fa-mobile-alt"></i>';
          }
          btn.classList.add('px-2');
        }
      }
      // 3. Change "Export MTI Ledger & Logs (.xlsx)" to "Create PDF MTI DPR"
      else if (txt.indexOf('Export MTI') !== -1 || href.indexOf('export') !== -1 || btn.id === 'btnCreatePdfMtiDpr') {
        btn.id = 'btnCreatePdfMtiDpr';
        btn.title = 'Create Daily Progress Report PDF (00:00 to 23:59 logs)';
        btn.innerHTML = '<i class="fas fa-file-pdf me-1"></i>Create PDF MTI DPR';
        btn.onclick = function(ev) {
          ev.preventDefault();
          const dtVal = getSelectedDprDate();
          const survVal = window.MTI_CURRENT_USER_NAME || detectCurrentUserFromDom() || '';
          const qs = new URLSearchParams();
          if (dtVal) qs.set('date', dtVal);
          if (survVal) qs.set('surveyor_name', survVal);
          window.open('/mti/create_pdf_dpr' + (qs.toString() ? ('?' + qs.toString()) : ''), '_blank');
        };
        btn.setAttribute('href', '/mti/create_pdf_dpr');
        dprAnchorBtn = btn;
      }
      // 4. Remove Reports Hub button from MTI top bar
      else if (txt.indexOf('Reports Hub') !== -1 || href.indexOf('reports_hub') !== -1 || href === '/reports') {
        btn.remove();
      }
      // 5. Remove Survey Setup button from MTI top bar
      else if (txt.indexOf('Survey Setup') !== -1 && btn.id !== 'btnStudioSurveySetup') {
        btn.remove();
      }
    });

    // 6. Inject or update the "CHART" button right after "Create PDF MTI DPR"
    let chartBtn = document.getElementById('btnTop4PanelWin');
    if (!chartBtn && dprAnchorBtn && dprAnchorBtn.parentNode) {
      chartBtn = document.createElement('a');
      chartBtn.id = 'btnTop4PanelWin';
      chartBtn.target = '_blank';
      chartBtn.className = 'btn btn-sm btn-info text-dark fw-bold';
      chartBtn.style.cssText = 'background:#38bdf8;border-color:#0284c7;color:#0f172a;';
      dprAnchorBtn.parentNode.insertBefore(chartBtn, dprAnchorBtn.nextSibling);
    }
    if (chartBtn) {
      chartBtn.innerHTML = '&#128202; CHART';
      chartBtn.title = 'Open 4-Panel Verification & Submittal Studio';
      const activeUser = window.MTI_CURRENT_USER_NAME || detectCurrentUserFromDom() || '';
      chartBtn.href = '/mti/studio' + (activeUser ? ('?surveyor_name=' + encodeURIComponent(activeUser)) : '');
    }
  }

  function initMti4PanelUpgrades() {
    document.querySelectorAll('p, div, small, span').forEach(function(el) {
      if (el.children.length <= 2) {
        const t = (el.textContent || '').trim();
        if (t.indexOf('CAD Design Mattresses') !== -1 || (t.indexOf('Centerline Offset') !== -1 && t.indexOf('Inter-Mattress Gap') !== -1)) {
          el.remove();
        }
      }
    });

    removeLine4ZInputs();
    customizeTopActionBar();

    const fixForm = document.getElementById('mattressFixForm') || document.querySelector('form[action*="add_fix"], form[action*="fix"]');
    if (fixForm) {
      if (!fixForm.querySelector('[name="surveyor_name"]')) {
        const dtInp = fixForm.querySelector('[name="install_date"], [name*="date"]');
        if (dtInp && dtInp.parentNode) {
          const sDiv = document.createElement('div');
          sDiv.className = dtInp.parentNode.className || 'col-md-3 col-6';
          const initUser = window.MTI_CURRENT_USER_NAME || detectCurrentUserFromDom() || '';
          sDiv.innerHTML = '<label class="form-label small fw-bold text-info">Surveyor Name</label>' +
            '<input type="text" name="surveyor_name" id="inpFormSurveyorName" class="form-control form-control-sm fw-bold" placeholder="Current User" value="' + initUser.replace(/"/g, '&quot;') + '">';
          dtInp.parentNode.parentNode.insertBefore(sDiv, dtInp.parentNode.nextSibling);
        }
      } else {
        syncSurveyorInputBox(true);
      }

      if (!document.getElementById('btnPreview4Panel')) {
        const saveBtn = fixForm.querySelector('button[type="submit"]');
        if (saveBtn) {
          saveBtn.parentNode.classList.add('d-flex', 'flex-wrap', 'gap-1', 'justify-content-end', 'align-items-center');
          const b = document.createElement('button');
          b.type = 'button';
          b.id = 'btnPreview4Panel';
          b.className = 'btn btn-sm btn-info text-dark fw-bold';
          b.style.cssText = 'background:#38bdf8;border-color:#0284c7;color:#0f172a;white-space:nowrap;';
          b.innerHTML = '&#128202; CHART';
          b.onclick = function() {
            syncSurveyorInputBox(true);
            const fd = new FormData(fixForm), qs = new URLSearchParams();
            fd.forEach(function(v, k) {
              if (v !== null && String(v).trim() !== '') qs.set(k, String(v).trim());
            });
            const sInp = document.getElementById('inpFormSurveyorName');
            if (sInp && sInp.value.trim()) {
              qs.set('surveyor_name', sInp.value.trim());
            } else if (window.MTI_CURRENT_USER_NAME) {
              qs.set('surveyor_name', window.MTI_CURRENT_USER_NAME);
            }
            window.open('/mti/studio?' + qs.toString(), '_blank');
          };
          saveBtn.parentNode.insertBefore(b, saveBtn.nextSibling);
        }
      }
    }

    let rowCounter = 0;
    document.querySelectorAll('table tbody tr').forEach(function(tr) {
      if (tr.querySelector('.btn-4panel-ledger')) return;
      const rowTxt = (tr.innerText || tr.textContent || '').replace(/\s+/g, ' ');
      const mBox = rowTxt.match(/CR-[A-Z0-9-]+_M\d+/i);
      if (!mBox && rowTxt.indexOf('CL:') === -1 && rowTxt.indexOf('1st Unit') === -1) return;

      rowCounter += 1;
      const boxId = mBox ? mBox[0] : '';
      const mXing = rowTxt.match(/\b(CR-[A-Z0-9]+(?:_L\d+)?)\b/i);
      const xingId = mXing ? mXing[1] : (boxId ? boxId.split('_M')[0] : 'CR-A1_L1');
      const mUnit = rowTxt.match(/#(\d+)\s+\d{4}-\d{2}-\d{2}/);
      const uno = mUnit ? mUnit[1] : String(rowCounter);
      const mTag = rowTxt.match(/#(A\d+|\d{3,4})\b/i);
      const tagId = mTag ? ('#' + mTag[1].replace('#', '')) : '';

      const lastTd = tr.cells[tr.cells.length - 1];
      if (!lastTd) return;

      const a = document.createElement('a');
      a.href = '#';
      a.className = 'btn btn-sm btn-info text-dark fw-bold me-1 btn-4panel-ledger';
      a.style.cssText = 'padding:2px 7px;font-size:11.5px;background:#38bdf8;border-color:#0284c7;color:#0f172a;display:inline-flex;align-items:center;gap:3px;';
      a.title = 'Open ' + (boxId || ('Unit #' + uno)) + ' in 4-Panel Chart Studio (New Window)';
      a.innerHTML = '&#128202; CHART';
      a.onclick = function(ev) {
        ev.preventDefault();
        const sInp = document.getElementById('inpFormSurveyorName');
        const activeSurv = (sInp && sInp.value.trim() && sInp.value.trim().toLowerCase() !== 'duty surveyor')
          ? sInp.value.trim()
          : (window.MTI_CURRENT_USER_NAME || detectCurrentUserFromDom() || '');
        const url = '/mti/studio?crossing_id=' + encodeURIComponent(xingId) +
                    '&box_id=' + encodeURIComponent(boxId) +
                    '&physical_tag=' + encodeURIComponent(tagId) +
                    '&unit_no=' + encodeURIComponent(uno) +
                    (activeSurv ? ('&surveyor_name=' + encodeURIComponent(activeSurv)) : '');
        window.open(url, '_blank');
      };

      const firstBtn = lastTd.querySelector('button, a, form');
      if (firstBtn) {
        firstBtn.parentNode.insertBefore(a, firstBtn);
      } else {
        lastTd.appendChild(a);
      }

      lastTd.querySelectorAll('button').forEach(function(editBtn) {
        editBtn.addEventListener('click', function() {
          setTimeout(function() {
            removeLine4ZInputs();
            syncSurveyorInputBox(true);
          }, 80);
        });
      });
    });
  }

  fetch('/mti/whoami')
    .then(function(r) { return r.json(); })
    .then(function(d) {
      if (d && d.user_name && d.user_name.toLowerCase() !== 'duty surveyor') {
        window.MTI_CURRENT_USER_NAME = d.user_name;
        syncSurveyorInputBox(true);
        const topStudio = document.getElementById('btnTop4PanelWin');
        if (topStudio) topStudio.href = '/mti/studio?surveyor_name=' + encodeURIComponent(d.user_name);
      }
    })
    .catch(function() {});

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initMti4PanelUpgrades);
  } else {
    initMti4PanelUpgrades();
  }
  setTimeout(initMti4PanelUpgrades, 250);
})();
</script>
