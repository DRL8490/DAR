<!-- STEP 3: 4-PANEL SUBSEA MATTRESS VERIFICATION & REPORTING STUDIO -->
<script id="mti4PanelStudioUpgrade">
(function(){
  function inject4PanelStudio(){
    if (document.getElementById('studio4Panel')) return;

    const studioWrapper = document.createElement('div');
    studioWrapper.id = 'studio4Panel';
    studioWrapper.className = 'card shadow-sm border-primary mb-4 mt-3';
    studioWrapper.innerHTML = `
      <div class="card-header bg-dark text-white d-flex flex-wrap justify-content-between align-items-center py-2 px-3">
        <div>
          <span class="fw-bold text-info"><i class="fas fa-drafting-compass me-2"></i>4-Panel Subsea Mattress Verification &amp; Submittal Studio</span>
          <span class="badge bg-primary ms-2">ISO A3 Chart + ISO A4 PDF + Word (.docx)</span>
        </div>
        <div class="d-flex flex-wrap gap-1 mt-1 mt-md-0" id="studio4PanelDlBar">
          <a id="btnDlA3Pdf" href="/mti/download_a3_pdf" class="btn btn-xs btn-sm btn-danger fw-bold"><i class="fas fa-file-pdf me-1"></i>A3 4-Panel PDF</a>
          <a id="btnDlA3Png" href="/mti/download_a3_png?dl=1" class="btn btn-xs btn-sm btn-info text-dark fw-bold"><i class="fas fa-image me-1"></i>A3 PNG</a>
          <a id="btnDlA4Pdf" href="/mti/download_a4_pdf" class="btn btn-xs btn-sm btn-warning text-dark fw-bold"><i class="fas fa-file-alt me-1"></i>A4 Report PDF</a>
          <a id="btnDlDocx" href="/mti/download_docx" class="btn btn-xs btn-sm btn-primary fw-bold"><i class="fas fa-file-word me-1"></i>Word (.docx)</a>
        </div>
      </div>
      <div class="card-body p-3 bg-light">
        <form id="form4PanelVerify" onsubmit="return window.run4PanelVerify(event)" enctype="multipart/form-data">
          <input type="hidden" name="ajax" value="1">
          <div class="row g-2 align-items-end mb-2">
            <div class="col-md-2 col-6">
              <label class="form-label small fw-bold mb-1">Crossing Array ID</label>
              <input type="text" class="form-control form-control-sm fw-bold" name="crossing_id" id="fpCrossingId" value="CR-A1_L1">
            </div>
            <div class="col-md-2 col-6">
              <label class="form-label small fw-bold mb-1">Mattress Location ID</label>
              <input type="text" class="form-control form-control-sm fw-bold text-primary" name="location_id" id="fpLocationId" value="CR-A1_M15" placeholder="AUTO or CR-A1_M15">
            </div>
            <div class="col-md-2 col-6">
              <label class="form-label small fw-bold mb-1">Mattress Tag ID *</label>
              <input type="text" class="form-control form-control-sm fw-bold text-success" name="mattress_id" id="fpMattressId" value="#A046" placeholder="001 or #A046">
            </div>
            <div class="col-md-2 col-6">
              <label class="form-label small fw-bold mb-1">Survey Date/Time</label>
              <input type="text" class="form-control form-control-sm" name="install_date" id="fpDateStr" value="2026-11-04 14:34">
            </div>
            <div class="col-md-1 col-4">
              <label class="form-label small fw-bold mb-1">P1 Scale</label>
              <select class="form-select form-select-sm" name="scale_p1" id="fpScaleP1">
                <option value="200">1:200</option>
                <option value="250" selected>1:250</option>
                <option value="300">1:300</option>
                <option value="400">1:400</option>
              </select>
            </div>
            <div class="col-md-1 col-4">
              <label class="form-label small fw-bold mb-1">P2 Scale</label>
              <select class="form-select form-select-sm" name="scale_p2" id="fpScaleP2">
                <option value="50">1:50</option>
                <option value="75" selected>1:75</option>
                <option value="100">1:100</option>
              </select>
            </div>
            <div class="col-md-2 col-4">
              <div class="form-check form-switch mb-1">
                <input class="form-check-input" type="checkbox" id="fpIncHist" name="include_history" value="true" checked>
                <label class="form-check-label small fw-bold" for="fpIncHist">Historical Data</label>
              </div>
              <button type="submit" id="btnRun4Panel" class="btn btn-sm btn-success w-100 fw-bold"><i class="fas fa-sync-alt me-1"></i>Generate 4-Panel</button>
            </div>
          </div>

          <div class="p-2 rounded border bg-white mb-2">
            <div class="d-flex flex-wrap justify-content-between align-items-center mb-1">
              <span class="small fw-bold text-secondary"><i class="fas fa-layer-group me-1"></i>Input Coordinates (4 ROV Corners E, N, Z) OR Upload MBES Point Cloud (.xyz / .csv / .txt):</span>
              <div class="d-flex gap-2 align-items-center">
                <label class="small fw-bold text-primary mb-0">MBES Cloud File:</label>
                <input type="file" class="form-control form-control-sm" style="max-width:210px;" name="cloud_file" id="fpCloudFile" accept=".xyz,.txt,.csv">
              </div>
            </div>
            <div class="row g-1">
              <div class="col-md-3 col-6"><div class="input-group input-group-sm"><span class="input-group-text fw-bold">C1 (NW)</span><input type="number" step="any" class="form-control" name="c1_e" id="fpC1E" value="194540.642" placeholder="E"><input type="number" step="any" class="form-control" name="c1_n" id="fpC1N" value="2702616.819" placeholder="N"><input type="number" step="any" class="form-control" name="c1_z" id="fpC1Z" value="-18.20" placeholder="Z"></div></div>
              <div class="col-md-3 col-6"><div class="input-group input-group-sm"><span class="input-group-text fw-bold">C2 (NE)</span><input type="number" step="any" class="form-control" name="c2_e" id="fpC2E" value="194543.513" placeholder="E"><input type="number" step="any" class="form-control" name="c2_n" id="fpC2N" value="2702615.948" placeholder="N"><input type="number" step="any" class="form-control" name="c2_z" id="fpC2Z" value="-18.20" placeholder="Z"></div></div>
              <div class="col-md-3 col-6"><div class="input-group input-group-sm"><span class="input-group-text fw-bold">C3 (SE)</span><input type="number" step="any" class="form-control" name="c3_e" id="fpC3E" value="194541.770" placeholder="E"><input type="number" step="any" class="form-control" name="c3_n" id="fpC3N" value="2702610.207" placeholder="N"><input type="number" step="any" class="form-control" name="c3_z" id="fpC3Z" value="-18.20" placeholder="Z"></div></div>
              <div class="col-md-3 col-6"><div class="input-group input-group-sm"><span class="input-group-text fw-bold">C4 (SW)</span><input type="number" step="any" class="form-control" name="c4_e" id="fpC4E" value="194538.899" placeholder="E"><input type="number" step="any" class="form-control" name="c4_n" id="fpC4N" value="2702611.078" placeholder="N"><input type="number" step="any" class="form-control" name="c4_z" id="fpC4Z" value="-18.20" placeholder="Z"></div></div>
            </div>
          </div>
        </form>

        <div id="fpKpiStrip" class="row g-2 mb-2">
          <div class="col-md-3 col-6"><div class="p-2 border rounded bg-white"><div class="text-muted" style="font-size:11px;">DELIVERABLE BASE FILENAME</div><div id="fpKpiFile" class="fw-bold small text-primary text-truncate">20261104_Mattress_CR-A1_M15_A046</div></div></div>
          <div class="col-md-2 col-6"><div class="p-2 border rounded bg-white"><div class="text-muted" style="font-size:11px;">RADIAL BOX OFFSET</div><div id="fpKpiOffset" class="fw-bold small text-success">0.265 m (dAl +0.05, dCr -0.26)</div></div></div>
          <div class="col-md-2 col-6"><div class="p-2 border rounded bg-white"><div class="text-muted" style="font-size:11px;">SOUTH BRG / DELTA</div><div id="fpKpiBrg" class="fw-bold small">196.889 deg (dAz +1.04 deg)</div></div></div>
          <div class="col-md-2 col-6"><div class="p-2 border rounded bg-white"><div class="text-muted" style="font-size:11px;">CLOUD MRR / IN-BOX %</div><div id="fpKpiMrr" class="fw-bold small">6.00x3.00 m | 85.6%</div></div></div>
          <div class="col-md-3 col-12"><div class="p-2 border rounded bg-white"><div class="text-muted" style="font-size:11px;">CRANE NUDGE TO DESIGN</div><div id="fpKpiNudge" class="fw-bold small text-dark">Move 0.27 m toward ESE (116.7 deg)</div></div></div>
        </div>

        <div class="row g-3">
          <div class="col-lg-7">
            <div class="border rounded bg-white p-2 h-100">
              <div class="d-flex justify-content-between align-items-center mb-1">
                <span class="small fw-bold text-dark"><i class="fas fa-map me-1 text-danger"></i>ISO A3 4-Panel Verification Chart Preview (Fixed Scale)</span>
                <span id="fpVerdictBadge" class="badge bg-success">READY</span>
              </div>
              <div class="text-center bg-dark rounded p-1" style="min-height:320px;display:flex;align-items:center;justify-content:center;">
                <img id="fpChartImg" src="/mti/download_a3_png?t=init" class="img-fluid rounded" style="max-height:520px;background:#fff;" alt="ISO A3 4-Panel Chart Preview">
              </div>
            </div>
          </div>
          <div class="col-lg-5">
            <div class="border rounded bg-white p-2 h-100 d-flex flex-column">
              <div class="d-flex flex-wrap justify-content-between align-items-center mb-1 gap-1">
                <span class="small fw-bold text-dark"><i class="fas fa-edit me-1 text-primary"></i>Editable ISO A4 &amp; Word (.docx) Report Studio</span>
                <div class="btn-group btn-group-sm">
                  <button type="button" class="btn btn-outline-secondary active" id="btnModeVisual" onclick="window.switchFpEditMode('visual')">Visual Edit</button>
                  <button type="button" class="btn btn-outline-secondary" id="btnModeMd" onclick="window.switchFpEditMode('md')">Markdown Source</button>
                </div>
              </div>
              <div id="fpVisualEditor" contenteditable="true" class="form-control small flex-grow-1 mb-2" style="height:360px;overflow-y:auto;font-family:system-ui,sans-serif;line-height:1.45;background:#fcfcfd;"></div>
              <textarea id="fpMdEditor" class="form-control form-control-sm font-monospace flex-grow-1 mb-2" style="height:360px;display:none;"></textarea>
              <div class="d-flex justify-content-between align-items-center gap-2">
                <button type="button" class="btn btn-sm btn-primary fw-bold flex-grow-1" onclick="window.save4PanelReportEdits()"><i class="fas fa-save me-1"></i>Apply Edits to A4 PDF &amp; Word (.docx)</button>
                <span id="fpSaveStatus" class="small fw-bold text-success"></span>
              </div>
            </div>
          </div>
        </div>
      </div>
    `;

    const mainContainer = document.querySelector('.container-fluid, .container') || document.body;
    mainContainer.appendChild(studioWrapper);

    document.querySelectorAll('form[action*="add_fix"]').forEach(function(f){
      if (!f.querySelector('#btnSendTo4Panel')) {
        const submitBtn = f.querySelector('button[type="submit"]');
        if (submitBtn) {
          const btn4p = document.createElement('button');
          btn4p.type = 'button';
          btn4p.id = 'btnSendTo4Panel';
          btn4p.className = 'btn btn-sm btn-info text-dark fw-bold ms-2';
          btn4p.innerHTML = '<i class="fas fa-drafting-compass me-1"></i>Send 4 Corners to 4-Panel Studio';
          btn4p.onclick = function(){ window.sendFixFormTo4Panel(f); };
          submitBtn.parentNode.insertBefore(btn4p, submitBtn.nextSibling);
        }
      }
    });

    window.decorateLedgerWith4PanelBtns();

    fetch('/mti/last_4panel_json').then(r => r.json()).then(data => {
      if (data && data.result && data.result.base_filename) {
        window.apply4PanelResultToUI(data.result);
      }
    }).catch(function(){});
  }

  function mdToSimpleHtml(md){
    return String(md || '').split('\n').map(function(line){
      const l = line.trim();
      if (!l) return '<div style="height:6px;"></div>';
      if (l.startsWith('# ')) return '<h6 class="fw-bold text-dark border-bottom pb-1 mb-1">' + l.slice(2) + '</h6>';
      if (l.startsWith('## ')) return '<div class="fw-bold text-primary bg-light px-2 py-1 mt-2 mb-1 rounded">' + l.slice(3) + '</div>';
      if (l.startsWith('|')) {
        if (l.indexOf(':---') !== -1) return '';
        return '<div class="font-monospace" style="font-size:11px;white-space:pre-wrap;border-bottom:1px solid #eee;">' + l + '</div>';
      }
      return '<div>' + l.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>') + '</div>';
    }).join('');
  }

  function htmlToSimpleMd(el){
    const lines = [];
    el.childNodes.forEach(function(node){
      const txt = (node.innerText || node.textContent || '').trim();
      if (!txt) { lines.push(''); return; }
      if (node.tagName === 'H6') lines.push('# ' + txt);
      else if (node.className && String(node.className).indexOf('text-primary') !== -1) lines.push('## ' + txt);
      else lines.push(txt);
    });
    return lines.join('\n');
  }

  window.switchFpEditMode = function(mode){
    const vis = document.getElementById('fpVisualEditor');
    const md = document.getElementById('fpMdEditor');
    const bVis = document.getElementById('btnModeVisual');
    const bMd = document.getElementById('btnModeMd');
    if (mode === 'md') {
      md.value = htmlToSimpleMd(vis) || md.value;
      vis.style.display = 'none';
      md.style.display = 'block';
      bVis.classList.remove('active');
      bMd.classList.add('active');
    } else {
      vis.innerHTML = mdToSimpleHtml(md.value);
      md.style.display = 'none';
      vis.style.display = 'block';
      bMd.classList.remove('active');
      bVis.classList.add('active');
    }
  };

  window.apply4PanelResultToUI = function(r){
    if (!r) return;
    const fn = r.base_filename || '20261104_Mattress_CR-A1_M15_A046';
    document.getElementById('fpCrossingId').value = r.crossing_id || 'CR-A1_L1';
    document.getElementById('fpLocationId').value = r.location_id || 'CR-A1_M15';
    document.getElementById('fpMattressId').value = r.mattress_id || '#A046';
    document.getElementById('fpDateStr').value = r.date_str || '';
    document.getElementById('fpKpiFile').textContent = fn;
    document.getElementById('fpKpiOffset').textContent = (r.radial_box || 0).toFixed(3) + ' m (dAl ' + (r.d_along_box >= 0 ? '+' : '') + (r.d_along_box || 0).toFixed(2) + ', dCr ' + (r.d_cross_box >= 0 ? '+' : '') + (r.d_cross_box || 0).toFixed(2) + ')';
    document.getElementById('fpKpiBrg').textContent = (r.south_brg_cloud || 0).toFixed(3) + ' deg (dAz ' + (r.d_az >= 0 ? '+' : '') + (r.d_az || 0).toFixed(2) + ' deg)';
    document.getElementById('fpKpiMrr').textContent = (r.cloud_l || 6).toFixed(2) + 'x' + (r.cloud_w || 3).toFixed(2) + ' m | ' + (r.pct_inside || 0).toFixed(1) + '%';
    document.getElementById('fpKpiNudge').textContent = 'Move ' + (r.nudge_dist || 0).toFixed(2) + ' m toward ' + (r.nudge_dir || 'TARGET') + ' (' + (r.nudge_az || 0).toFixed(1) + ' deg)';

    const badge = document.getElementById('fpVerdictBadge');
    badge.textContent = r.verdict_short || 'VERIFIED';
    badge.className = 'badge ' + ((r.verdict_short || '').indexOf('PASS') !== -1 ? 'bg-success' : 'bg-warning text-dark');

    document.getElementById('btnDlA3Pdf').href = '/mti/download_a3_pdf?file=' + encodeURIComponent(fn);
    document.getElementById('btnDlA3Png').href = '/mti/download_a3_png?dl=1&file=' + encodeURIComponent(fn);
    document.getElementById('btnDlA4Pdf').href = '/mti/download_a4_pdf?file=' + encodeURIComponent(fn);
    document.getElementById('btnDlDocx').href = '/mti/download_docx?file=' + encodeURIComponent(fn);

    const img = document.getElementById('fpChartImg');
    if (r.png_b64) {
      img.src = 'data:image/png;base64,' + r.png_b64;
    } else {
      img.src = '/mti/download_a3_png?file=' + encodeURIComponent(fn) + '&t=' + Date.now();
    }

    if (r.report_md) {
      document.getElementById('fpMdEditor').value = r.report_md;
      document.getElementById('fpVisualEditor').innerHTML = mdToSimpleHtml(r.report_md);
    }
  };

  window.run4PanelVerify = function(ev){
    if (ev) ev.preventDefault();
    const form = document.getElementById('form4PanelVerify');
    const btn = document.getElementById('btnRun4Panel');
    const fd = new FormData(form);
    fd.set('include_history', document.getElementById('fpIncHist').checked ? 'true' : 'false');
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin me-1"></i>Rendering...';
    fetch('/mti/verify_4panel', { method: 'POST', body: fd, headers: {'Accept': 'application/json'} })
      .then(r => r.json())
      .then(data => {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-sync-alt me-1"></i>Generate 4-Panel';
        if (data && data.result) {
          window.apply4PanelResultToUI(data.result);
        }
      })
      .catch(err => {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-sync-alt me-1"></i>Generate 4-Panel';
        alert('Verification error: ' + err);
      });
    return false;
  };

  window.save4PanelReportEdits = function(){
    const vis = document.getElementById('fpVisualEditor');
    const md = document.getElementById('fpMdEditor');
    const isMdMode = md.style.display !== 'none';
    const finalMd = isMdMode ? md.value : htmlToSimpleMd(vis);
    md.value = finalMd;
    const baseFn = document.getElementById('fpKpiFile').textContent.trim();
    const st = document.getElementById('fpSaveStatus');
    st.textContent = 'Saving...';
    fetch('/mti/update_4panel_report', {
      method: 'POST',
      headers: {'Content-Type': 'application/json', 'Accept': 'application/json'},
      body: JSON.stringify({ base_filename: baseFn, report_md: finalMd, ajax: '1' })
    }).then(r => r.json()).then(data => {
      st.textContent = 'Saved A4 PDF & Word!';
      setTimeout(function(){ st.textContent = ''; }, 3000);
    }).catch(function(){ st.textContent = 'Error saving'; });
  };

  window.sendFixFormTo4Panel = function(f){
    const getVal = name => (f.querySelector('[name="' + name + '"]') || {}).value || '';
    document.getElementById('fpCrossingId').value = getVal('crossing_id') || 'CR-A1_L1';
    document.getElementById('fpLocationId').value = getVal('design_box_id') || 'CR-A1_M15';
    document.getElementById('fpMattressId').value = getVal('physical_tag') || '001';
    document.getElementById('fpDateStr').value = getVal('install_date') || '';
    for (let i = 1; i <= 4; i++) {
      if (getVal('c'+i+'_e')) document.getElementById('fpC'+i+'E').value = getVal('c'+i+'_e');
      if (getVal('c'+i+'_n')) document.getElementById('fpC'+i+'N').value = getVal('c'+i+'_n');
      if (getVal('c'+i+'_z')) document.getElementById('fpC'+i+'Z').value = getVal('c'+i+'_z');
    }
    document.getElementById('studio4Panel').scrollIntoView({behavior: 'smooth'});
    window.run4PanelVerify();
  };

  window.openLedgerRowIn4Panel = function(rowObj){
    if (!rowObj) return;
    document.getElementById('fpCrossingId').value = rowObj.crossing_id || 'CR-A1_L1';
    document.getElementById('fpLocationId').value = rowObj.design_box_id || 'CR-A1_M15';
    document.getElementById('fpMattressId').value = rowObj.physical_tag || '001';
    document.getElementById('fpDateStr').value = rowObj.install_date || '';
    for (let i = 1; i <= 4; i++) {
      if (rowObj['c'+i+'_e']) document.getElementById('fpC'+i+'E').value = rowObj['c'+i+'_e'];
      if (rowObj['c'+i+'_n']) document.getElementById('fpC'+i+'N').value = rowObj['c'+i+'_n'];
      if (rowObj['c'+i+'_z']) document.getElementById('fpC'+i+'Z').value = rowObj['c'+i+'_z'];
    }
    document.getElementById('studio4Panel').scrollIntoView({behavior: 'smooth'});
    window.run4PanelVerify();
  };

  window.decorateLedgerWith4PanelBtns = function(){
    document.querySelectorAll('button[onclick*="editFix"], button[onclick*="loadFixForEdit"]').forEach(function(btn){
      if (btn.parentNode.querySelector('.btn-4panel-row')) return;
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'btn btn-xs btn-sm btn-outline-info fw-bold ms-1 btn-4panel-row';
      b.title = 'Generate 4-Panel Chart & Report';
      b.innerHTML = '<i class="fas fa-chart-area"></i> 4-Panel';
      b.onclick = function(e){
        e.stopPropagation();
        const oc = btn.getAttribute('onclick') || '';
        const m = oc.match(/\{.*\}/);
        if (m) {
          try { window.openLedgerRowIn4Panel(JSON.parse(m[0])); return; } catch(err){}
        }
        btn.click();
        setTimeout(function(){
          const f = document.querySelector('form[action*="add_fix"]');
          if (f) window.sendFixFormTo4Panel(f);
        }, 150);
      };
      btn.parentNode.insertBefore(b, btn);
    });
  };

  document.addEventListener('DOMContentLoaded', inject4PanelStudio);
})();
</script>
